<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="جستجو و کشف در ساختار ارشد ایرانیان؛ پروژه‌ها، حوزه‌ها، ایده‌ها و فرصت‌های توسعه."><title>جستجو | ارشد ایرانیان</title><link rel="stylesheet" href="../assets/css/site.css"><style>.search-hero{padding:72px 0 42px;background:linear-gradient(135deg,#f8f4eb,#eef4ef 55%,#fff);position:relative;overflow:hidden}.search-hero h1 span{color:#214d3a}.search-box{margin-top:28px;background:#fff;border:1px solid #dce2d9;border-radius:26px;padding:10px;display:flex;gap:10px;box-shadow:0 18px 55px rgba(29,71,55,.1)}.search-box input{flex:1;border:0;outline:0;font:inherit;font-size:18px;padding:18px 20px;background:transparent}.search-box select{border:0;border-right:1px solid #e4e6df;background:#f7f6f1;border-radius:16px;padding:0 18px;font:inherit;color:#34495e}.discover-meta{display:flex;justify-content:space-between;align-items:center;margin:26px 0 16px}.discover-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.discover-card{background:#fff;border:1px solid #e3e4dc;border-radius:20px;padding:22px;box-shadow:0 8px 30px rgba(25,65,45,.06);transition:.2s}.discover-card:hover{transform:translateY(-3px)}.discover-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:16px}.pill,.status,.discover-tags span{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;font-size:12px}.pill{background:#edf3ee;color:#214d3a}.status{background:#f5f3ee;color:#68788a}.discover-card h3{margin:0 0 10px;font-size:20px;color:#214d3a}.discover-card p{color:#647486;line-height:1.9;margin:0 0 15px}.discover-tags{display:flex;flex-wrap:wrap;gap:6px}.discover-tags span{background:#f8f7f3;color:#778393}.discover-link{display:block;margin-top:18px;color:#214d3a;font-weight:700}.discover-link.muted{color:#9aa7b4}.empty-state{grid-column:1/-1;text-align:center;padding:60px 20px;background:#fff;border:1px dashed #cbd5ca;border-radius:22px}.quick-search{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.quick-search button{border:1px solid #d7dfd6;background:#fff;border-radius:999px;padding:8px 13px;font:inherit;cursor:pointer;color:#41604d}@media(max-width:900px){.discover-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.search-box{display:block}.search-box select{width:100%;height:48px;border-right:0;border-top:1px solid #e4e6df}.discover-grid{grid-template-columns:1fr}}</style></head><body><main><section class="search-hero"><div class="wrap"><span class="eyebrow">کشف فرصت‌ها · ایده‌ها · پروژه‌ها · مسیرهای توسعه</span><h1>در <span>ساختار ارشد</span> جستجو کنید</h1><p>از یک پروژه و برند تا یک حوزه راهبردی یا فرصت آینده؛ مسیرهای مختلف توسعه را پیدا کنید و از یک نقطه به نقطه دیگر برسید.</p><div class="search-box"><input data-ecosystem-search type="search" placeholder="مثلاً: هوش مصنوعی، سرمایه‌گذاری، دانشگاه، چت، برند..." autocomplete="off"><select data-search-filter><option>همه</option><option>حوزه راهبردی</option><option>مجموعه فعال</option><option>پلتفرم</option><option>محصول</option><option>پروژه</option><option>فرصت آینده</option></select></div><div class="quick-search"><button type="button" data-q="هوش مصنوعی">هوش مصنوعی</button><button type="button" data-q="سرمایه گذاری">سرمایه‌گذاری</button><button type="button" data-q="دانشگاه">دانشگاه</button><button type="button" data-q="پلتفرم">پلتفرم</button><button type="button" data-q="آینده">آینده</button></div></div></section><section><div class="wrap"><div class="discover-meta"><div><span class="kicker">بانک کشف</span><h2>نتایج و مسیرهای مرتبط</h2></div><strong data-search-count>در حال بارگذاری...</strong></div><div class="discover-grid" data-search-results></div></div></section></main><script src="../data/ecosystem.js"></script><script src="../data/collections.js?v=1"></script><script src="../assets/js/ecosystem.js?v=2"></script><script>const params=new URLSearchParams(window.location.search);if(params.get('q')){const input=document.querySelector('[data-ecosystem-search]');input.value=params.get('q');input.dispatchEvent(new Event('input'))}document.querySelectorAll('[data-q]').forEach(button=>button.addEventListener('click',()=>{const input=document.querySelector('[data-ecosystem-search]');input.value=button.dataset.q;input.dispatchEvent(new Event('input'));input.focus()}));</script><script src="../assets/js/shell.js?v=17"></script></body></html>
