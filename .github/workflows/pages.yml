name: Deploy Arshad Iranianian Website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate and build homepage runtime
        shell: bash
        run: |
          test -f "assets/fonts/shekasteh v2.001.woff"
          test -f "assets/fonts/shekasteh v2.001.ttf"
          test -f "assets/fonts/shekasteh v2.001.eot"
          python - <<'PY'
          from pathlib import Path
          css_path=Path('index.css')
          css=css_path.read_text(encoding='utf-8')
          import_rule="@import url('https://v1.fontapi.ir/css/IranNastaliq');"
          css=css.replace(import_rule,'')
          css=import_rule+css
          css_path.write_text(css,encoding='utf-8')
          html_path=Path('index.html')
          html=html_path.read_text(encoding='utf-8')
          preload='<link rel="preload" href="assets/fonts/shekasteh%20v2.001.woff" as="font" type="font/woff" crossorigin>'
          if preload not in html:
              html=html.replace('<link rel="stylesheet" href="index.css?v=3">',preload+'<link rel="stylesheet" href="index.css?v=5">',1)
          else:
              html=html.replace('index.css?v=3','index.css?v=5')
          html_path.write_text(html,encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
