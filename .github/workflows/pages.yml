name: Deploy Arshad Iranianian Website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate site sources
        run: |
          test -f "index.html"
          test -f "index.css"
          test -f "assets/fonts/shekasteh v2.001.woff"
          test -f "assets/fonts/irannastaliq.woff"
          test -f "assets/js/shell.js"
          test -f "assets/js/home-sections.js"
          test -f "assets/js/home4-curation.js"
          test -f "assets/css/pages.css"
          test -f "pages/ecosystem.html"
          test -f "pages/projects.html"
          grep -q "assets/fonts/irannastaliq.woff" index.css
          grep -q "mobile-bottom-nav" assets/js/shell.js
          grep -q "گروه برنامه‌ریزی و سرمایه‌گذاری ارشد" pages/ecosystem.html
          grep -q "زیست‌بوم هوشمند فناوری" pages/ecosystem.html
          grep -q "assets/js/shell.js?v=15" pages/ecosystem.html
          grep -q "assets/js/shell.js?v=15" pages/projects.html
          ! grep -q "۴۲ بخش راهبردی و صدها محور توسعه" pages/ecosystem.html
          ! grep -q "این بخش فقط مجموعه‌ها و هسته‌های واقعی را نشان می‌دهد" pages/ecosystem.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
