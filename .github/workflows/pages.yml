name: Deploy Arshad Iranianian Website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate source files
        shell: bash
        run: |
          test -f "assets/fonts/shekasteh v2.001.woff"
          test -f "assets/fonts/shekasteh v2.001.ttf"
          test -f "assets/fonts/shekasteh v2.001.eot"
          test -f "assets/js/home-sections.js"
          test -f "assets/js/home-content-depth.js"
          test -f "assets/js/site-integrity.js"
          test -f "assets/js/shell.js"
          test -f "assets/css/pages.css"
          test -f "assets/css/home-sections.css"
          test -f "index.html"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
