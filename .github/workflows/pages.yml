name: Deploy Arshad Iranianian Website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply one-time Shekasteh fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('index.css')
          s = css.read_text(encoding='utf-8')
          font = "@font-face{font-family:'Shekasteh';src:url('assets/fonts/shekasteh%20v2.001.woff') format('woff'),url('assets/fonts/shekasteh%20v2.001.ttf') format('truetype'),url('assets/fonts/shekasteh%20v2.001.eot') format('embedded-opentype');font-weight:400;font-style:normal;font-display:swap}"
          if "font-family:'Shekasteh'" not in s.split('}',1)[0]:
              s = font + s
          s = s.replace("font-family:'Shekasteh','Iran Nastaliq','IranNastaliq',serif!important", "font-family:'Shekasteh'!important")
          css.write_text(s, encoding='utf-8')
          html = Path('index.html')
          h = html.read_text(encoding='utf-8')
          old = '<div class="logo-wrap"><div class="logo-halo"></div><img src="arshadiranianlogo.png" alt="نشان شرکت جامع راهبردی ارشد ایرانیان" class="main-logo"></div>'
          new = '<div class="logo-wrap"><a class="main-logo-link" href="#home" aria-label="بازگشت به صفحه اصلی"><div class="logo-halo"></div><img src="arshadiranianlogo.png" alt="نشان شرکت جامع راهبردی ارشد ایرانیان" class="main-logo"></a></div>'
          if old in h:
              h = h.replace(old, new, 1)
          style = ".main-logo-link{width:100%;height:100%;display:grid;place-items:center;position:relative;border-radius:50%;cursor:pointer}.main-logo-link:hover .main-logo{transform:scale(1.035)}"
          marker = '<style>.footer-site-title{'
          if style not in h:
              h = h.replace(marker, '<style>' + style + '.footer-site-title{', 1)
          html.write_text(h, encoding='utf-8')
          PY
      - name: Remove temporary fix and commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pages.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace('  contents: write','  contents: read',1)
          start=s.index('      - name: Apply one-time Shekasteh fix')
          end=s.index('      - name: Configure Pages',start)
          s=s[:start]+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html index.css .github/workflows/pages.yml
          git commit -m 'Fix main title font and logo link'
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
